services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - iftech

  backend:
    build: ./backend
    container_name: backend
    environment:
      - OLLAMA_URL=${OLLAMA_URL}
      - LLM_MODEL=${LLM_MODEL}
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    networks:
      - iftech

  frontend:
    build: ./frontend
    container_name: frontend
    environment:
      - BACKEND_URL=${BACKEND_URL}
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - iftech

networks:
  iftech:
    driver: bridge

volumes:
  ollama_data:
