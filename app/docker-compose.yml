services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    networks:
      - iftech

  backend:
    build: ./backend
    container_name: backend
    environment:
      - OLLAMA_URL=${OLLAMA_URL}
      - LLM_MODEL=${LLM_MODEL}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - iftech

  frontend:
    build: ./frontend
    container_name: frontend
    environment:
      - BACKEND_URL=${BACKEND_URL}
    ports:
      - "8501:8501"
    depends_on:
      - backend
    networks:
      - iftech

networks:
  iftech:
    driver: bridge

volumes:
  ollama_data:
